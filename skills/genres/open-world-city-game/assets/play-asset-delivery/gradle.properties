# gradle.properties (project root) — keys that affect delivery and size reporting.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Play App Signing: upload key only, never the app-signing key.
# storeFile=upload.jks  (keep the keystore outside the repo)
# storePassword / keyAlias / keyPassword come from the environment or CI secrets.

# Split native code by ABI so Play can deliver armeabi-v7a devices a smaller bundle.
android.bundle.enableUncompressedNativeLibs=false

# Report real download sizes from the bundle, not the folder.
org.gradle.parallel=true
org.gradle.caching=true
